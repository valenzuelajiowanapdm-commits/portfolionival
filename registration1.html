<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <div>

        <header class="header">
            <h1>MY PERSONAL WEBSITE</h1>
            <p>Welcome to my personal website</p>
        </header>

        <nav class="page">

            <a href="home2.html"> Home </a>
            <a href="registration1.html"> Registration </a>
            <a href="grades.html"> Grades </a>
            <a href="profile1.html"> Profile </a>

        </nav>

    </div>

    <div>
        <form class="form">

            Student Name: 
            <br>
            <input type="text" name="first_name"/>

            <br>

            Email: 
            <br>
            <input type="text" name="email"/>

            <br>

            Password:
            <br>
            <input type="password" name="password"/>

            <br>

            Gender
            <br>
            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female">Female

            <br>

            Course
            <br>
            <select name="dropdown">

                <option value="IT" selected>IT</option>
                <option value="CSS" >CSS</option>
                <option value="HM" >HM</option>
                <option value="TM" >TM</option>
                <option value="OAD" >OAD</option>

            </select>

            <br>

            Skills
            <br>
            <input type="checkbox" name="HTML" value="on">HTML
            <input type="checkbox" name="CSS" value="on">CSS
            <input type="checkbox" name="JavaScript" value="on">JavaScript

            <br>

            Profile Picture
            <br>
            <input type="file" name="Choose File" accept="image/*"/>

            <br>

            Address 
            <br>
            <textarea rows="5" cols="50" name="Address" placeholder="address here"></textarea>

            <br>

            <input type="submit" name="submit" value="submit"/>
            <input type="reset" name="reset" value="reset"/>

 
        </form>
    </div>
    
</body>
</html>
