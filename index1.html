<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>
        .body1{
            text-align: center;
            margin-top: 75px;
            font-size: 50px;
            font-family: Arial, Helvetica, sans-serif;
        }
        button{
            background-color: rgb(224, 113, 252);
            color: rgb(27, 1, 24);
            font-size: 15px;
            border: none;
            padding: 20px 45px;
            border-radius: 15px;
        }
        #message{
            font-weight: bold;
            font-size: 25px;
            color: rgb(114, 10, 173);
        }
        
        .btn {
            display: inline-block;
            padding: 15px 20px;
            background: #4a148c;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: .3s;
        }

        .btn:hover {
            background: #6a1b9a;
            transform: scale(1.05);
        }
   
    </style>
</head>

<body>
    <a href="index.html" class="btn">Click here to go back</a>
    <div class="body1">
    <h1>JavaScript Demo</h1>

    <button id="loadBtn">
        left
    </button>

    <button id="clickBtn">
        right
    </button>

    <p id="message"> 
        waiting......
    </p>

    <p id="profile">Profile</p>
    <p id="grades">Grades</p>
    <p id="schedules">Schedules</p>
    </div>

    <script src="index1.js"></script>

</body>
</html>
